<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moved — Clothing Studio</title>
<!-- Catch-all. GitHub Pages serves this for any path in the old project site that
     no longer exists (the .obj models, shade-*.png, the old sitemap/robots, and
     any URL that was ever shared). Everything lands on the new home page.
     No canonical here on purpose: this page answers many different URLs, so
     claiming one canonical for all of them would be a false signal. The refresh
     still gets real visitors to the right place. -->
<meta http-equiv="refresh" content="0; url=https://random-cactus.github.io/" />
<script>location.replace("https://random-cactus.github.io/");</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFE6EB;
       color:#2b2b2b;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .card{max-width:34rem;text-align:center}
  h1{font-size:1.35rem;margin:0 0 .5rem}
  a{color:#d4276f;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <h1>This page has moved</h1>
    <p>Clothing Studio now lives at
       <a href="https://random-cactus.github.io/">random-cactus.github.io</a>.</p>
  </div>
</body>
</html>
